name: Build Release Zip

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-legacy:
    name: Harmony 2 smoke tests on .NET Framework
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project Tests/Smoke -c Release -f net472

  build-release:
    name: Build and release
    needs: smoke-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Source/NoCavesContinued.csproj

      - name: Build
        run: dotnet build Source/NoCavesContinued.csproj -c Release --no-restore

      - name: Verify behavior, reference contracts, and payload rules
        run: |
          dotnet run --project Tests/Smoke -c Release -f net10.0
          dotnet run --project Tests/Contracts -c Release
          python3 -m unittest discover -s Tests -p 'test_*.py' -v

      - name: Generate Steam Workshop description
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/md2steam-venv"
          "$RUNNER_TEMP/md2steam-venv/bin/python" -m pip install md2steam==1.0.1
          "$RUNNER_TEMP/md2steam-venv/bin/python" \
            scripts/generate-steam-workshop-description.py \
            README.md \
            "$RUNNER_TEMP/SteamWorkshopDescription.txt"

      - name: Package and validate mod
        id: package
        shell: bash
        run: |
          set -euo pipefail

          zip_path="$GITHUB_WORKSPACE/NoCavesContinued-${GITHUB_RUN_NUMBER}.zip"
          python3 scripts/package_mod.py \
            --description "$RUNNER_TEMP/SteamWorkshopDescription.txt" \
            --output "$zip_path"

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Save candidate package
        uses: actions/upload-artifact@v7
        with:
          name: NoCavesContinued
          path: ${{ steps.package.outputs.zip_path }}
          overwrite: true

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="build-${GITHUB_RUN_NUMBER}"
          title="No Caves - Continued build ${GITHUB_RUN_NUMBER}"
          notes="Automated release from main branch commit ${GITHUB_SHA}."

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "Refusing to mark an outdated main commit as the latest release." >&2
            exit 1
          fi
          gh release create "$tag" "${{ steps.package.outputs.zip_path }}" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes" \
            --latest

  deploy-workshop:
    name: Deploy the tested release to Steam Workshop
    needs: build-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STEAM_WORKSHOP_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: steam-workshop
    timeout-minutes: 20
    concurrency:
      group: steam-workshop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download this run's validated release
        uses: actions/download-artifact@v8
        with:
          name: NoCavesContinued
          path: ${{ runner.temp }}/workshop-release

      - name: Install SteamCMD system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lib32gcc-s1 lib32stdc++6

      - name: Refuse an outdated main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "Refusing to replace Steam Workshop content with an outdated main commit." >&2
            exit 1
          fi

      - name: Publish existing Workshop item
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          bash scripts/deploy-steam-workshop.sh \
            "$RUNNER_TEMP/workshop-release/NoCavesContinued-${GITHUB_RUN_NUMBER}.zip" \
            "Update from GitHub release build-${GITHUB_RUN_NUMBER} (${GITHUB_SHA})."
